<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Онлайн-бронирование развлечений парка «Сказочная Лагуна»"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 10%27%3E%3Ctext y=%27.9em%27 font-size=%278%27%3E🌊%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@600&display=swap&subset=cyrillic" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><title>Мои брони — Сказочная Лагуна</title></head><body><header class="top" id="top"></header>
<main class="section"><div class="wrap"><h1 style="font-size:2rem">Мои брони</h1><div id="list"></div></div></main>
<footer class="foot" id="foot"></footer><script src="/js/common.js"></script><script>const ST={pending:'Ожидает',confirmed:'Подтверждена',cancelled:'Отменена'};
async function load(){const r=await api('/api/bookings/my');
$('#list').innerHTML=r.map(b=>'<div class="bk"><div><h3 style="margin:0">'+esc(b.title)+'</h3>'+when(b.starts_at)+'</div><div>Бронь №'+b.id+' · '+rub(b.total_price)+'</div><span class="badge '+b.status+'">'+ST[b.status]+'</span>'+(b.status!=='cancelled'?'<button class="link" data-c="'+b.id+'">Отменить</button>':'')+'</div>').join('')||'<div class="empty"><p>Броней пока нет.</p><a class="btn alt" href="/attractions.html">Выбрать развлечение</a></div>'}
$('#list').addEventListener('click',async e=>{const id=e.target.dataset.c;if(id&&confirm('Отменить бронь №'+id+'?')){await api('/api/bookings/'+id+'/cancel',{method:'PATCH'});load()}});
init().then(u=>{if(needAuth(u))load()});</script></body></html>
